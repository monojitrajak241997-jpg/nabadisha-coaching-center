<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NABADISHA COACHING CENTER</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4ff;color:#172033}.app{max-width:650px;margin:auto;background:#fff;min-height:100vh}header{background:linear-gradient(135deg,#1565c0,#673ab7);color:#fff;text-align:center;padding:24px 12px}main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}.grid button,.primary{background:#1565c0;color:#fff}.card{background:#fff;border:1px solid #dce5f2;border-radius:16px;padding:18px;box-shadow:0 4px 14px #dbe3ef;margin-bottom:15px}.option{display:block;width:100%;text-align:left;margin:9px 0;background:#f4f7fb;border:2px solid #dce2ea}.hidden{display:none}.row{display:flex;gap:8px}.row>*{flex:1}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd6e3;border-radius:10px;margin:6px 0 12px;font-size:16px}textarea{min-height:90px}.danger{background:#d32f2f;color:#fff}.secondary{background:#673ab7;color:#fff}.small{font-size:13px;color:#607080}.tag{font-weight:bold}</style></head><body><div class="app"><header><h1>🏫 NABADISHA COACHING CENTER</h1><p>Educational MCQ Practice</p></header><main>
<section id="home"><h2>📚 বিষয় নির্বাচন করুন</h2><div id="subjects" class="grid"></div><div class="card"><button class="secondary" style="width:100%" onclick="showAdmin()">⚙️ Admin / Question Manager</button><button class="primary" style="width:100%;margin-top:8px" onclick="shareApp()">📤 Share App</button><button style="width:100%;margin-top:8px" onclick="copyLink()">📋 Copy Link</button></div></section>
<section id="quiz" class="hidden"><button onclick="goHome()" style="width:100%;margin-bottom:10px">⬅️ Back</button><div class="row"><b id="sub"></b><b id="count"></b></div><div class="card"><h2 id="q"></h2><div id="opts"></div><button id="next" class="primary" style="width:100%" disabled onclick="nextQ()">Next ➜</button><button class="secondary" style="width:100%;margin-top:8px" onclick="shareQuestion()">❓ Share Question</button></div></section>
<section id="result" class="hidden"><div class="card" style="text-align:center"><h2>🎉 পরীক্ষা শেষ!</h2><h2 id="score"></h2><p id="msg"></p><div class="row"><button class="primary" onclick="goHome()">🏠 Home</button><button class="secondary" onclick="startQuiz(currentSubject)">🔄 আবার</button></div><button class="primary" style="width:100%;margin-top:8px" onclick="shareResult()">🏆 Share Result</button></div></section>
<section id="admin" class="hidden"><button onclick="goHome()" style="width:100%;margin-bottom:10px">⬅️ Back</button><div class="card"><h2>⚙️ Question Manager</h2><label>Subject</label><select id="asub"><option>বাংলা</option><option>Hindi</option><option>English</option><option>Math</option><option>Reasoning</option><option>GK</option><option>Science</option></select><label>Question</label><textarea id="aq" placeholder="প্রশ্ন লিখুন"></textarea><label>Option A</label><input id="a0"><label>Option B</label><input id="a1"><label>Option C</label><input id="a2"><label>Option D</label><input id="a3"><label>Correct Answer</label><select id="ans"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><button class="primary" style="width:100%" onclick="addQ()">💾 Save Question</button><button onclick="goHome()" style="width:100%;margin-top:8px">🏠 Home</button></div><div class="card"><h3>Saved Questions</h3><div id="list"></div><button class="danger" style="width:100%;margin-top:10px" onclick="resetAll()">🗑️ Delete My Added Questions</button></div></section>
</main></div><script>
const base={বাংলা:[['বাংলা ভাষার প্রধান দুটি রূপ কোনটি?',['সাধু ও চলিত','কাব্য ও গদ্য','দেশি ও বিদেশি','মৌখিক ও লিখিত'],0],['দিন শব্দের বিপরীত শব্দ কী?',['রাত্রি','সকাল','আলো','সূর্য'],0]],Hindi:[['दिन का विलोम शब्द क्या है?',['रात','सुबह','समय','प्रकाश'],0]],English:[['Plural of Child?',['Childs','Childes','Children','Childrens'],2]],Math:[['25 + 37 = ?',['52','62','72','57'],1]],Reasoning:[['2, 4, 6, 8, ?',['10','11','12','14'],0]],GK:[['ভারতের রাজধানী কোনটি?',['মুম্বাই','নয়াদিল্লি','কলকাতা','চেন্নাই'],1]],Science:[['জলের রাসায়নিক সংকেত কী?',['CO₂','O₂','H₂O','NaCl'],2]]};
let added=JSON.parse(localStorage.getItem('nabadishaQuestions')||'[]');let data={};let currentSubject='',i=0,score=0;function rebuild(){data={};Object.keys(base).forEach(s=>data[s]=base[s].map(x=>({q:x[0],o:x[1],a:x[2],custom:false})));added.forEach((x,n)=>{(data[x.s]||(data[x.s]=[])).push({...x,custom:true,n})});}function renderSubjects(){rebuild();let box=document.getElementById('subjects');box.innerHTML='';Object.keys(data).forEach(s=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>startQuiz(s);box.appendChild(b)})}function hideAll(){['home','quiz','result','admin'].forEach(x=>document.getElementById(x).classList.add('hidden'))}function goHome(){hideAll();document.getElementById('home').classList.remove('hidden');renderSubjects();history.pushState({page:'home'},'',location.href.split('#')[0]+'#home')}
function backAction(){if(!document.getElementById('quiz').classList.contains('hidden')||!document.getElementById('admin').classList.contains('hidden')||!document.getElementById('result').classList.contains('hidden')){goHome()}else{history.back()}}
history.replaceState({page:'home'},'',location.href.split('#')[0]+'#home');window.addEventListener('popstate',()=>{hideAll();document.getElementById('home').classList.remove('hidden');renderSubjects()})function startQuiz(s){rebuild();currentSubject=s;i=0;score=0;hideAll();document.getElementById('quiz').classList.remove('hidden');history.pushState({page:'quiz'},'',location.href.split('#')[0]+'#quiz');showQ()}function showQ(){let x=data[currentSubject][i];document.getElementById('sub').textContent='📚 '+currentSubject;document.getElementById('count').textContent=(i+1)+'/'+data[currentSubject].length;document.getElementById('q').textContent=x.q;let o=document.getElementById('opts');o.innerHTML='';x.o.forEach((v,k)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+k)+') '+v;b.onclick=()=>select(k,b);o.appendChild(b)});document.getElementById('next').disabled=true}function select(k,b){document.querySelectorAll('.option').forEach(x=>x.disabled=true);let x=data[currentSubject][i];if(k===x.a){score++;b.style.background='#b9e6bd'}else{b.style.background='#f3aaaa';document.querySelectorAll('.option')[x.a].style.background='#b9e6bd'}document.getElementById('next').disabled=false}function nextQ(){i++;if(i<data[currentSubject].length)showQ();else{hideAll();document.getElementById('result').classList.remove('hidden');let p=Math.round(score/data[currentSubject].length*100);document.getElementById('score').textContent=`Score: ${score}/${data[currentSubject].length} (${p}%)`;document.getElementById('msg').textContent=p>=80?'🌟 Excellent!':p>=50?'👍 ভালো হয়েছে!':'💪 আরও Practice করুন!'}}function showAdmin(){hideAll();document.getElementById('admin').classList.remove('hidden');history.pushState({page:'admin'},'',location.href.split('#')[0]+'#admin');renderList()}function addQ(){let s=document.getElementById('asub').value,q=document.getElementById('aq').value.trim(),o=[0,1,2,3].map(k=>document.getElementById('a'+k).value.trim()),a=+document.getElementById('ans').value;if(!q||o.some(x=>!x)){alert('প্রশ্ন ও সব Option পূরণ করুন।');return}added.push({s,q,o,a});localStorage.setItem('nabadishaQuestions',JSON.stringify(added));['aq','a0','a1','a2','a3'].forEach(id=>document.getElementById(id).value='');alert('প্রশ্ন Save হয়েছে ✅');renderSubjects();renderList()}function renderList(){let el=document.getElementById('list');if(!added.length){el.innerHTML='<p class="small">এখনও নিজের প্রশ্ন যোগ করা হয়নি।</p>';return}el.innerHTML=added.map((x,n)=>`<div class="card"><span class="tag">${n+1}. [${x.s}]</span> ${escapeHtml(x.q)}<br><span class="small">সঠিক উত্তর: ${'ABCD'[x.a]}</span><br><button class="danger" style="margin-top:8px" onclick="delQ(${n})">Delete</button></div>`).join('')}function delQ(n){if(confirm('এই প্রশ্নটি Delete করবেন?')){added.splice(n,1);localStorage.setItem('nabadishaQuestions',JSON.stringify(added));renderList();renderSubjects()}}function resetAll(){if(confirm('আপনার যোগ করা সব প্রশ্ন Delete করবেন?')){added=[];localStorage.removeItem('nabadishaQuestions');renderList();renderSubjects()}}
function shareText(text){if(navigator.share){navigator.share({title:'NABADISHA COACHING CENTER',text:text}).catch(()=>{});}else{navigator.clipboard?.writeText(text).then(()=>alert('Share text copied ✅')).catch(()=>alert(text));}}
function shareApp(){shareText('🏫 NABADISHA COACHING CENTER\n📚 Educational MCQ Practice\nআমি এই Quiz App ব্যবহার করছি। আপনিও Practice করুন! 🎯');}
function copyLink(){navigator.clipboard?.writeText(location.href).then(()=>alert('App link copied ✅')).catch(()=>prompt('এই link টি Copy করুন:',location.href));}
function shareQuestion(){let x=data[currentSubject][i];shareText('🏫 NABADISHA COACHING CENTER\n📚 '+currentSubject+'\n❓ '+x.q+'\nA) '+x.o[0]+'\nB) '+x.o[1]+'\nC) '+x.o[2]+'\nD) '+x.o[3]);}
function shareResult(){let total=data[currentSubject].length,p=Math.round(score/total*100);shareText('🏫 NABADISHA COACHING CENTER\n📚 '+currentSubject+' MCQ Result\n🏆 Score: '+score+'/'+total+'\n📊 Percentage: '+p+'%');}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}renderSubjects();
</script></body></html>
